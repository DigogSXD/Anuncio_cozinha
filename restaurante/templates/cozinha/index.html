<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozinha — KDS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cor-aguardando: #dc3545;
      --cor-preparo:    #fd7e14;
      --cor-pronto:     #198754;
      --bg:             #0d0d0d;
      --bg-card:        #1a1a1a;
      --bg-header:      #161616;
      --borda:          #2a2a2a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: #f8f9fa;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ════════════════════════════════
       HEADER / BARRA SUPERIOR
    ════════════════════════════════ */
    .kds-header {
      background: var(--bg-header);
      border-bottom: 2px solid var(--borda);
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }

    .kds-titulo {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .contadores {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .contador-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--borda);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: .75rem;
      white-space: nowrap;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .kds-relogio {
      font-size: 1.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #ffc107;
      white-space: nowrap;
    }

    /* ════════════════════════════════
       ÁREA PRINCIPAL
    ════════════════════════════════ */
    .kds-body {
      height: calc(100vh - 60px);
      overflow-y: auto;
      padding: 16px;
    }

    /* ════════════════════════════════
       GRID DE PEDIDOS
    ════════════════════════════════ */
    .kds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      align-content: start;
    }

    /* ════════════════════════════════
       ESTADO VAZIO — centralizado
    ════════════════════════════════ */
    .kds-vazio {
      display: none;               /* JS controla com flex */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: calc(100vh - 92px); /* viewport - header - padding */
      opacity: .25;
      pointer-events: none;
    }
    .kds-vazio i  { font-size: 6rem; }
    .kds-vazio p  { font-size: 1.2rem; font-weight: 600; margin: 0; }

    /* ════════════════════════════════
       CARD DE PEDIDO
    ════════════════════════════════ */
    .pedido-card {
      background: var(--bg-card);
      border-radius: 14px;
      border: 2px solid var(--borda);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: slideIn .3s ease both;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .pedido-card[data-status="aguardando"] { border-color: var(--cor-aguardando); }
    .pedido-card[data-status="em_preparo"] { border-color: var(--cor-preparo); }
    .pedido-card[data-status="pronto"]     { border-color: var(--cor-pronto); }

    /* Header do card */
    .pedido-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .pedido-card[data-status="aguardando"] .pedido-header { background: rgba(220,53,69,.15); }
    .pedido-card[data-status="em_preparo"] .pedido-header { background: rgba(253,126,20,.15); }
    .pedido-card[data-status="pronto"]     .pedido-header { background: rgba(25,135,84,.15); }

    .pedido-mesa { font-size: 2rem; font-weight: 900; line-height: 1; }
    .pedido-meta { font-size: .75rem; opacity: .65; }
    .pedido-num  { font-size: .7rem;  opacity: .5; }

    .pedido-timer {
      font-size: .95rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,.07);
      white-space: nowrap;
    }
    .timer-urgente { color: #ff4d4d; animation: piscar 1s infinite; }
    @keyframes piscar {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    .status-tag {
      font-size: .6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .tag-aguardando { background: var(--cor-aguardando); color: #fff; }
    .tag-em_preparo { background: var(--cor-preparo);    color: #fff; }
    .tag-pronto     { background: var(--cor-pronto);     color: #fff; }

    /* Itens do pedido */
    .pedido-itens { padding: 12px 16px; flex: 1; }
    .item-linha {
      display: flex;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid var(--borda);
      font-size: .92rem;
    }
    .item-linha:last-child { border-bottom: none; }
    .item-qty { font-weight: 900; font-size: 1.05rem; color: #ffc107; min-width: 28px; }

    /* Observação */
    .pedido-obs {
      margin: 0 16px 10px;
      background: rgba(255,193,7,.1);
      border-left: 3px solid #ffc107;
      padding: 6px 10px;
      border-radius: 0 6px 6px 0;
      font-size: .78rem;
      color: #ffc107;
    }

    /* Botões de ação */
    .pedido-acoes {
      padding: 10px 12px;
      border-top: 1px solid var(--borda);
      display: flex;
      gap: 8px;
    }
    .btn-acao {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: .85rem;
      cursor: pointer;
      transition: transform .1s, opacity .15s;
    }
    .btn-acao:active  { transform: scale(.96); }
    .btn-iniciar  { background: var(--cor-preparo); color: #fff; }
    .btn-pronto   { background: var(--cor-pronto);  color: #fff; }
    .btn-entregar { background: #6c757d;            color: #fff; }

    /* Alerta de novo pedido */
    #alerta-novo {
      display: none;
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: #dc3545;
      color: #fff;
      padding: 9px 26px;
      border-radius: 30px;
      font-weight: 700;
      font-size: .9rem;
      z-index: 999;
      animation: popIn .3s ease both;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateX(-50%) scale(.7); }
      to   { opacity: 1; transform: translateX(-50%) scale(1); }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════
     CABEÇALHO
══════════════════════════════════════════════════════ -->
<header class="kds-header">

  <div class="kds-titulo">
    <i class="bi bi-fire me-1 text-warning"></i>Cozinha
    {% if current_user.is_authenticated %}
      <span style="font-size:.75rem;opacity:.5;margin-left:6px;text-transform:none;font-weight:400">
        — {{ current_user.nome }}
      </span>
    {% endif %}
  </div>

  <div class="contadores">
    <div class="contador-badge">
      <div class="dot" style="background:var(--cor-aguardando)"></div>
      <span id="cnt-aguardando">0</span>&nbsp;aguardando
    </div>
    <div class="contador-badge">
      <div class="dot" style="background:var(--cor-preparo)"></div>
      <span id="cnt-preparo">0</span>&nbsp;em preparo
    </div>
    <div class="contador-badge">
      <div class="dot" style="background:var(--cor-pronto)"></div>
      <span id="cnt-pronto">0</span>&nbsp;prontos
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:12px">
    <span class="kds-relogio" id="relogio">--:--:--</span>
    <a href="{{ url_for('auth.logout') }}"
       class="btn btn-sm btn-outline-secondary"
       title="Sair do sistema">
      <i class="bi bi-box-arrow-right"></i>
    </a>
  </div>

</header>

<!-- Alerta novo pedido -->
<div id="alerta-novo">
  <i class="bi bi-bell-fill me-2"></i>Novo pedido!
</div>

<!-- ══════════════════════════════════════════════════════
     ÁREA DE CONTEÚDO
══════════════════════════════════════════════════════ -->
<div class="kds-body">

  <!-- Estado vazio -->
  <div class="kds-vazio" id="kdsVazio">
    <i class="bi bi-check2-circle"></i>
    <p>Nenhum pedido em aberto</p>
  </div>

  <!-- Grid de cards -->
  <div class="kds-grid" id="kdsGrid"></div>

</div>

<!-- ══════════════════════════════════════════════════════
     JAVASCRIPT — KDS
══════════════════════════════════════════════════════ -->
<script>
const POLL_MS     = 5000;
const URGENTE_MIN = 10;

let idsConhecidos = {};

// ── Relógio ──────────────────────────────────────────────
function tickRelogio() {
  document.getElementById('relogio').textContent =
    new Date().toLocaleTimeString('pt-BR');
}
setInterval(tickRelogio, 1000);
tickRelogio();

// ── Tempo decorrido a partir de "HH:MM" ─────────────────
function tempoDecorrido(hmStr) {
  const [h, m] = hmStr.split(':').map(Number);
  const agora  = new Date();
  const origem = new Date();
  origem.setHours(h, m, 0, 0);
  let ms = agora - origem;
  if (ms < 0) ms += 86400000;
  const min = Math.floor(ms / 60000);
  const seg = Math.floor((ms % 60000) / 1000);
  return { min, label: `${min}m ${String(seg).padStart(2,'0')}s` };
}

// ── Som ──────────────────────────────────────────────────
function tocarSom() {
  try {
    const ctx  = new (window.AudioContext || window.webkitAudioContext)();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + .15);
    gain.gain.setValueAtTime(.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .4);
    osc.start(); osc.stop(ctx.currentTime + .4);
  } catch (_) {}
}

// ── Alerta visual ────────────────────────────────────────
function alertaNovo() {
  const el = document.getElementById('alerta-novo');
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

// ── Renderiza ────────────────────────────────────────────
function renderizar(pedidos) {
  const grid   = document.getElementById('kdsGrid');
  const vazio  = document.getElementById('kdsVazio');
  const idsAtuais = new Set(pedidos.map(p => p.id));

  // Novos pedidos detectados
  if (pedidos.some(p => !idsConhecidos[p.id])) {
    alertaNovo();
    tocarSom();
  }

  // Remove cards que saíram
  document.querySelectorAll('.pedido-card').forEach(card => {
    if (!idsAtuais.has(parseInt(card.dataset.id))) {
      card.style.transition = 'opacity .3s, transform .3s';
      card.style.opacity = '0';
      card.style.transform = 'scale(.9)';
      setTimeout(() => card.remove(), 320);
    }
  });

  // Contadores
  document.getElementById('cnt-aguardando').textContent =
    pedidos.filter(p => p.status === 'aguardando').length;
  document.getElementById('cnt-preparo').textContent =
    pedidos.filter(p => p.status === 'em_preparo').length;
  document.getElementById('cnt-pronto').textContent =
    pedidos.filter(p => p.status === 'pronto').length;

  // Mostra/esconde estado vazio
  vazio.style.display = pedidos.length === 0 ? 'flex' : 'none';
  grid.style.display  = pedidos.length === 0 ? 'none' : 'grid';

  // Renderiza cada card
  const tagLabels = {
    aguardando: '⏳ Aguardando',
    em_preparo: '🔥 Em Preparo',
    pronto:     '✅ Pronto',
  };

  pedidos.forEach(pedido => {
    let card = grid.querySelector(`.pedido-card[data-id="${pedido.id}"]`);
    if (!card) {
      card = document.createElement('div');
      card.className = 'pedido-card';
      card.dataset.id = pedido.id;
      grid.appendChild(card);
    }
    card.dataset.status = pedido.status;

    const { min, label } = tempoDecorrido(pedido.criado_em);
    const urgente = min >= URGENTE_MIN ? 'timer-urgente' : '';

    const itensHtml = pedido.itens.map(it =>
      `<div class="item-linha">
         <span class="item-qty">${it.quantidade}×</span>
         <span>${it.nome}</span>
       </div>`
    ).join('');

    const obsHtml = pedido.observacao
      ? `<div class="pedido-obs">
           <i class="bi bi-chat-left-text me-1"></i>${pedido.observacao}
         </div>`
      : '';

    let botoesHtml = '';
    if (pedido.status === 'aguardando') {
      botoesHtml = `<button class="btn-acao btn-iniciar"
        onclick="mudarStatus(${pedido.id},'em_preparo')">🔥 Iniciar Preparo</button>`;
    } else if (pedido.status === 'em_preparo') {
      botoesHtml = `<button class="btn-acao btn-pronto"
        onclick="mudarStatus(${pedido.id},'pronto')">✅ Marcar Pronto</button>`;
    } else if (pedido.status === 'pronto') {
      botoesHtml = `<button class="btn-acao btn-entregar"
        onclick="mudarStatus(${pedido.id},'entregue')">🛎 Confirmar Entrega</button>`;
    }

    card.innerHTML = `
      <div class="pedido-header">
        <div>
          <div class="pedido-mesa">Mesa ${pedido.mesa_numero}</div>
          <div class="pedido-meta">Pedido #${pedido.id}</div>
          <div class="pedido-num">Entrada: ${pedido.criado_em}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <span class="status-tag tag-${pedido.status}">${tagLabels[pedido.status] || ''}</span>
          <span class="pedido-timer ${urgente}">${label}</span>
        </div>
      </div>
      <div class="pedido-itens">${itensHtml}</div>
      ${obsHtml}
      <div class="pedido-acoes">${botoesHtml}</div>
    `;

    idsConhecidos[pedido.id] = pedido.status;
  });

  // Limpa ids removidos do cache
  for (const id of Object.keys(idsConhecidos)) {
    if (!idsAtuais.has(parseInt(id))) delete idsConhecidos[id];
  }
}

// ── Busca pedidos ────────────────────────────────────────
async function buscarPedidos() {
  try {
    const res  = await fetch('/cozinha/pedidos.json?tudo=1');
    const data = await res.json();
    renderizar(data);
  } catch (e) {
    console.warn('[KDS] erro:', e);
  }
}

// ── Muda status ──────────────────────────────────────────
async function mudarStatus(id, status) {
  try {
    await fetch(`/cozinha/pedido/${id}/status`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    await buscarPedidos();
  } catch (e) {
    console.error('[KDS] erro ao mudar status:', e);
  }
}

// ── Atualiza timers a cada segundo ───────────────────────
setInterval(() => {
  document.querySelectorAll('.pedido-card').forEach(card => {
    const numEl = card.querySelector('.pedido-num');
    if (!numEl) return;
    const match = numEl.textContent.match(/(\d{2}:\d{2})/);
    if (!match) return;
    const { min, label } = tempoDecorrido(match[1]);
    const timerEl = card.querySelector('.pedido-timer');
    if (timerEl) {
      timerEl.textContent = label;
      timerEl.className = 'pedido-timer' + (min >= URGENTE_MIN ? ' timer-urgente' : '');
    }
  });
}, 1000);

// ── Inicia ───────────────────────────────────────────────
buscarPedidos();
setInterval(buscarPedidos, POLL_MS);
</script>
</body>
</html>
